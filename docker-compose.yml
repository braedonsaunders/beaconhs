# Dev uses DATABASE_URL from .env. Maintainers can keep pointing at the shared
# PG cluster, while open-source/local clones can opt into Postgres with:
#   docker compose --profile local-db up -d
# The in-browser Word/PowerPoint editor (Collabora, ~1.9 GB) is opt-in:
#   docker compose --profile local-db --profile collabora up -d
# Container names come from the Compose project (the checkout folder name by
# default), so several checkouts can coexist; only the published ports collide.
services:
  postgres:
    image: postgres:16-alpine
    profiles:
      - local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: beaconhs
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/cluster/local-init.sh:/docker-entrypoint-initdb.d/10-beaconhs-roles.sh:ro
      - ./scripts/cluster/provision.sql:/opt/beaconhs/provision.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beaconhs_app -d beaconhs']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO no longer publishes server images; pgsty/minio is the maintained
    # community build of the same server (same CLI, health endpoint and API).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: beaconhs
      MINIO_ROOT_PASSWORD: beaconhs-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

  # In-browser Word and PowerPoint editor (Documents and PPTX-mastered training
  # decks); opt-in via the `collabora` profile. The app
  # iframes http://localhost:9980; Collabora calls back into the app's
  # /wopi/files/* routes at host.docker.internal:3000 (COLLABORA_WOPI_URL).
  collabora:
    image: collabora/code:latest
    profiles:
      - collabora
    environment:
      # Allow the WOPI host (this app, as seen from inside the container).
      - aliasgroup1=http://host.docker.internal:3000
      # Plain http locally + let the app's origin iframe the editor. Welcome
      # ("Explore the new version") dialogs are noise inside an embedded editor.
      # Keep WOPI loads aligned with MAX_PPTX_FILE_BYTES (exactly 1 GiB).
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false --o:net.frame_ancestors=http://localhost:3000 --o:welcome.enable=false --o:home_mode.enable=true --o:storage.wopi.max_file_size=1073741824
    ports:
      - '9980:9980'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      # BeaconHS theme via the sanctioned branding.js hook (navy header etc.).
      - ./deploy/collabora-branding.js:/usr/share/coolwsd/browser/dist/branding.js:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
